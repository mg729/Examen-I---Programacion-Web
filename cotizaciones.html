<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <!--NAV-->
    <nav class="navbar navbar-expand-lg bg-dark sticky-top" data-bs-theme="dark">
        <div>
            <a class="navbar-brand" href="index.html"><i class="bi bi-amd"></i> DEINSA HONDURAS</a>

            <!--Btn hamburguesa-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Mostrar menu">
                <span class="navbar-toggler-icon"></span>
            </button>

        </div>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto aling-items-lg-center">
                <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="catalogo.html">Catalogo</a></li>
                <li class="nav-item"><a class="nav-link" href="tabla.html">Tabla comparativa</a></li>
                <li class="nav-item"><a class="nav-link" href="cotizaciones.html">Cotizaciones</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            </ul>
        </div>
        <div class="btn btn-outline-success"><a class="nav-link disabled" href="#"> <i class="bi bi-whatsapp"></i>
                Cotizar
                por WhatsApp</a></div>
    </nav>

    <!--CALCULADORA-->
    <main>
        <section class="py-5 bg-warning">
            <div class="container py-lg-4">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8">
                        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                            <div class="row g-3">
                                <h2>Cotizaciones</h2>
                                <p>Para realiza tu cotizacion, selecciona la cantidad de unidades y la localizacion donde deseas comprar los productos.</p>
                            </div>
                            <div class="">
                                <form action="#cotizaciones" method="post">
                                    <!--Campo 1-->
                                    <div class="form-floating">
                                        <div>
                                            <input class="form-control"  type="number" min="0" required>
                                            <label for="">Cantidad de unidades</label>
                                        </div>
                                    </div>
                                    <!--Campo 2-->
                                    <div class="form-floating">
                                        <div>
                                            <select class="form-select" name="" id="">
                                                <option value="" disabled selected>--Seleccione la ciudad de entrega y
                                                    el flete--
                                                </option>
                                                <option value="">San Pedro Sula - Flete: L.500</option>
                                                <option value="">Tegucigalpa - Flete: L.1,200</option>
                                                <option value="">Otras regiones - Flete: L.2,000</option>
                                            </select>
                                        </div>
                                    </div>
                                    <!--Boton Cotiza-->
                                    <div class="py-4 px-5">
                                        <button class="btn btn-outline-warning btn-lg fw-bold w-100 shadow">
                                            <i class="bi bi-calculator"></i> Cotizar
                                        </button>
                                    </div>
                                    <!--Resultado de la cotizacion-->
                                    <div class="form-floating">
                                        <div>
                                            <label for="">Resultado de la cotizacion:</label>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
